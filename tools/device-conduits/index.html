<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Hollow Wake · Conduit benchmark</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10161a;color:#edf0ec;font:1rem/1.5 system-ui,sans-serif}main{max-width:42rem;margin:auto;padding:2rem 1.3rem}h1{font:600 2.15rem/1.1 Georgia,serif}label{display:block;margin:1.1rem 0 .3rem}select,input,button,a{font:inherit;padding:.6rem .85rem;border-radius:.3rem}select,input{width:100%;background:#162127;color:inherit;border:1px solid #81958f}button,a{background:#dfc18b;color:#142022;border:0}button:disabled{opacity:.55}a{display:inline-block}p{max-width:55ch}[hidden]{display:none!important}output{display:block;margin:1rem 0}textarea{width:100%;height:8rem;background:#172027;color:inherit}progress{width:100%}:focus-visible{outline:3px solid #83cfea;outline-offset:2px}
</style></head><body><main>
<h1>Conduit benchmark</h1>
<p>Replay Stone Communion, Wellspring Stance and Ice Shield with Glacial Reservoir. Each actor has eight skill seats. Both steps must match the mana, poise and guard values recorded in Hollow Wake.</p>
<label for="count">Actors</label><select id="count"><option>24</option><option selected>120</option><option>480</option></select>
<label for="device">Device and power mode (optional)</label><input id="device" maxlength="100">
<p><button id="run">Run benchmark</button></p>
<progress id="progress" max="40" value="0" aria-label="Benchmark progress"></progress>
<output id="status" aria-live="polite">Keep the page visible while measuring.</output>
<a id="download" hidden>Save JSON report</a>
<details id="result" hidden><summary>Measurement details</summary><textarea id="report" readonly aria-label="JSON report"></textarea></details>
</main><script type="application/json" id="course">__COURSE__</script><script>__BUNDLE__</script></body></html>
