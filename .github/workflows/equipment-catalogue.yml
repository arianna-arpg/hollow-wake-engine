name: Verify original equipment catalogue
on:
  push:
    paths:
      - '.github/workflows/equipment-catalogue.yml'
      - 'reference/export-equipment-catalogue.ts'
      - 'scripts/reference-equipment-catalogue.mjs'
      - 'scripts/audit-equipment-catalogue.mjs'
      - 'scripts/test-equipment-catalogue-observer.mjs'
      - 'scripts/compile-item-content.mjs'
      - 'baseline/equipment-catalogue/**'
      - 'baseline/source-lock.json'
      - 'src/item-*.ts'
      - 'src/content.ts'
      - 'src/character.ts'
      - 'src/combat.ts'
      - 'src/stats.ts'
      - 'src/stat-rules.ts'
      - 'src/validation.ts'
      - 'content/milestone-one.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run reference:prepare
      - run: npm run reference:install
      - name: Compare two fresh original-game captures with the frozen observations
        run: node scripts/reference-equipment-catalogue.mjs
      - name: Audit compiled modifiers and numeric projections
        run: node scripts/audit-equipment-catalogue.mjs
      - name: Detect six deliberate omissions in the original derivation path
        run: node scripts/test-equipment-catalogue-observer.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: equipment-catalogue-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/equipment-catalogue-run-*.json
            .artifacts/equipment-catalogue-audit.json
            .artifacts/equipment-catalogue-observer.json
