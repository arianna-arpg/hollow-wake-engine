name: Verify unlock lifecycle baseline
on:
  push:
    paths:
      - '.github/workflows/unlock-lifecycle.yml'
      - 'baseline/unlock-lifecycle/**'
      - 'baseline/source-lock.json'
      - 'baseline/source.tar.gz'
      - 'baseline/overlay/**'
      - 'reference/export-unlock-*.ts'
      - 'reference/export-memory-rewards.ts'
      - 'reference/tooling/package*.json'
      - 'scripts/test-reference-unlock-lifecycle.mjs'
      - 'scripts/test-unlock-lifecycle-source-faults.mjs'
      - 'scripts/character-reference.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/vocation-reference.mjs'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: node scripts/test-reference-unlock-lifecycle.mjs
      - run: node scripts/test-unlock-lifecycle-source-faults.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: unlock-lifecycle-baseline-${{ matrix.os }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .artifacts/reference-unlock-lifecycle-*/verification.json
            .artifacts/unlock-lifecycle-source-faults-*/verification.json
            .artifacts/unlock-lifecycle-source-faults-*/progress.json
