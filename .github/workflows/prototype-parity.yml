name: Verify prototype combat parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - if: matrix.node == 24
        run: npm run reference:install
      - if: matrix.node == 24
        run: npm run reference:parity
      - run: npm run verify:parity
      - if: matrix.node == 24
        run: npm run reference:revision
      - run: npm run verify:revision
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: prototype-parity-${{ matrix.os }}-node${{ matrix.node }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .artifacts/parity-installed.json
            .artifacts/parity-owner-census.json
            .artifacts/revision-installed.json
