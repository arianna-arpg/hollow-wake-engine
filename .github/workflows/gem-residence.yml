name: Verify gem residence and item restoration
on:
  push:
    paths:
      - '.github/workflows/gem-residence.yml'
      - 'baseline/gem-residence/**'
      - 'baseline/source*'
      - 'baseline/overlay/**'
      - 'reference/export-gem-residence.ts'
      - 'reference/tooling/package*.json'
      - 'scripts/*gem-residence*.mjs'
      - 'scripts/character-reference.mjs'
      - 'scripts/vocation-reference.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/npm-cli.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'src/gem-residence.ts'
      - 'src/item-restoration.ts'
      - 'src/item-types.ts'
      - 'src/validation.ts'
      - 'src/skill-progression.ts'
      - 'test/gem-residence.test.mjs'
      - 'adapters/hollow-wake/*gem-residence*'
      - 'adapters/hollow-wake/install-character-sources.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  residence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run reference:gem-residence
      - run: npm run test:gem-residence-observer
      - run: npm run build
      - run: npm run test:gem-residence-package
      - run: npm run test:gem-residence-mutations
      - run: npm run adapter:gem-residence-source
      - run: npm run adapter:prepare
      - run: node scripts/test-game-gem-residence.mjs --location .artifacts/adapter-location.json
      - run: node scripts/test-gem-residence-installed-faults.mjs --location .artifacts/adapter-location.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gem-residence-${{ matrix.os }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .artifacts/reference-gem-residence-*/verification.json
            .artifacts/reference-gem-residence-*/*.txt
            .artifacts/gem-residence-source-faults-*/verification.json
            .artifacts/gem-residence-source-faults-*/*.txt
            .artifacts/gem-residence-package-*/verification.json
            .artifacts/gem-residence-mutations-*/verification.json
            .artifacts/gem-residence-overlay-*/verification.json
            .artifacts/installed-gem-residence-*/verification.json
            .artifacts/gem-residence-installed-faults-*/verification.json
