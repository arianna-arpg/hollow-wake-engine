name: Verify challenge controller
on:
  push:
    paths:
      - '.github/workflows/challenges.yml'
      - 'src/challenge*.ts'
      - 'test/challenge*'
      - 'scripts/*challenge*.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/npm-cli.mjs'
      - 'adapters/hollow-wake/**'
      - 'baseline/challenges/**'
      - 'baseline/challenge-continuation/**'
      - 'baseline/challenge-targeting/**'
      - 'baseline/source-lock.json'
      - 'baseline/source.tar.gz'
      - 'baseline/overlay/**'
      - 'reference/export-challenges.ts'
      - 'reference/export-challenge-continuation.ts'
      - 'reference/tooling/**'
      - 'package*.json'
      - 'tsconfig.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenges:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run build
      - run: npm run test:challenges-package
      - run: npm run test:challenge-targeting
      - run: npm run reference:challenges
      - run: npm run adapter:challenges
      - run: npm run test:challenge-continuation-package
      - run: npm run reference:challenge-continuation
      - run: npm run adapter:challenge-continuation
      - run: npm run adapter:challenges-composed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: challenges-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/challenges-package.json
            .artifacts/challenges-package.logs.json.gz
            .artifacts/challenge-targeting-check.json
            .artifacts/challenges-reference.json
            .artifacts/challenges-reference.logs.json.gz
            .artifacts/challenges-game.json
            .artifacts/challenges-game.logs.json.gz
            .artifacts/challenges-composed.json
            .artifacts/challenges-composed.logs.json.gz
            .artifacts/challenge-continuation-package.json
            .artifacts/challenge-continuation-package.logs.json.gz
            .artifacts/challenge-continuation-reference.json
            .artifacts/challenge-continuation-reference.logs.json.gz
            .artifacts/challenge-continuation-game.json
            .artifacts/challenge-continuation-game.logs.json.gz
