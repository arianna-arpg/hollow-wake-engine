name: Verify body levels
on:
  push:
    paths:
      - '.github/workflows/body-levels.yml'
      - 'src/body-levels.ts'
      - 'src/companion-bonds.ts'
      - 'src/companion-bond-rules.ts'
      - 'src/minion-inheritance.ts'
      - 'src/attribute-bequests.ts'
      - 'adapters/hollow-wake/integrate-body-levels.mjs'
      - 'adapters/hollow-wake/integrate-companion-bonds.mjs'
      - 'adapters/hollow-wake/install-character-sources.mjs'
      - 'adapters/hollow-wake/companionBonds.ts'
      - 'adapters/hollow-wake/companionSpec.ts'
      - 'adapters/hollow-wake/minionInheritance.ts'
      - 'adapters/hollow-wake/bequests.ts'
      - 'baseline/body-levels/**'
      - 'baseline/companion-continuation/**'
      - 'reference/export-body-levels.ts'
      - 'reference/export-companion-continuation.ts'
      - 'test/body-levels*'
      - 'test/companion-continuation-game.ts'
      - 'scripts/test-body-levels-package.mjs'
      - 'scripts/test-game-body-levels.mjs'
      - 'scripts/reference-body-levels.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bodies:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run build
      - run: npm run test:body-levels-package
      - run: npm run reference:body-levels
      - run: npm run adapter:body-levels
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: body-levels-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/body-levels-package.json
            .artifacts/body-levels-package.logs.json.gz
            .artifacts/body-levels-reference.json
            .artifacts/body-levels-reference.logs.json.gz
            .artifacts/body-levels-game.json
            .artifacts/body-levels-game.logs.json.gz
