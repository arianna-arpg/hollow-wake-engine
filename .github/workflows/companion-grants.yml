name: Verify persistent companion lifecycle
on:
  push:
    paths:
      - '.github/workflows/companion-grants.yml'
      - 'src/**'
      - 'baseline/**'
      - 'reference/export-companion-grants.ts'
      - 'reference/export-account-relic-build.ts'
      - 'reference/export-build-contributions.ts'
      - 'reference/export-equipment-live.ts'
      - 'test/companion-grants.test.mjs'
      - 'adapters/hollow-wake/**'
      - 'scripts/*companion-grants*.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run build
      - run: npm run test:companion-grants-package
      - run: npm run reference:companion-grants
      - run: npm run adapter:companion-grants
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: companion-grants-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/companion-grants-package.json
            .artifacts/companion-grants-package.logs.json.gz
            .artifacts/companion-grants-reference.json
            .artifacts/companion-grants-reference.logs.json.gz
            .artifacts/companion-grants-game.json
            .artifacts/companion-grants-game.logs.json.gz
