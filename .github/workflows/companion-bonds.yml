name: Verify companion bonds
on:
  push:
    paths:
      - '.github/workflows/companion-bonds.yml'
      - 'src/companion-bonds.ts'
      - 'src/companion-bond-rules.ts'
      - 'src/minion-inheritance.ts'
      - 'src/attribute-bequests.ts'
      - 'adapters/hollow-wake/companionBonds.ts'
      - 'adapters/hollow-wake/companionSpec.ts'
      - 'adapters/hollow-wake/minionInheritance.ts'
      - 'adapters/hollow-wake/bequests.ts'
      - 'adapters/hollow-wake/integrate-companion-bonds.mjs'
      - 'adapters/hollow-wake/install-character-sources.mjs'
      - 'baseline/guard-build/**'
      - 'baseline/bond-build/**'
      - 'baseline/companion-world-build/**'
      - 'baseline/bond-mechanics/**'
      - 'baseline/companion-continuation/**'
      - 'reference/export-guard-build.ts'
      - 'reference/export-bond-build.ts'
      - 'reference/export-companion-world-build.ts'
      - 'reference/export-companion-continuation.ts'
      - 'test/companion-bonds*'
      - 'test/companion-continuation-game.ts'
      - 'test/minion-inheritance*'
      - 'test/attribute-bequests*'
      - 'scripts/test-companion-bonds-package.mjs'
      - 'scripts/test-game-companion-bonds.mjs'
      - 'scripts/reference-companion-mechanics.mjs'
      - 'scripts/reference-build-lifecycles.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run build
      - run: npm run test:companion-bonds-package
      - run: npm run reference:companion-mechanics
      - run: npm run adapter:companion-bonds
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: companion-bonds-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/companion-bonds-package.json
            .artifacts/companion-bonds-package.logs.json.gz
            .artifacts/companion-mechanics-reference.json
            .artifacts/companion-mechanics-reference.logs.json.gz
            .artifacts/companion-bonds-game.json
            .artifacts/companion-bonds-game.logs.json.gz
