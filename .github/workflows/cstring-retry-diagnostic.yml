name: Diagnose native conversion retry
on:
  push:
    paths:
      - '.github/workflows/cstring-retry-diagnostic.yml'
      - 'experiments/embedded-js/patches/diagnose-cstring-retry.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
      - uses: ./.github/actions/prepare-embedded-runtime
      - name: Preserve retry errors with and without prior intrinsic initialization
        run: node experiments/embedded-js/patches/diagnose-cstring-retry.mjs --upstream .artifacts/embedded-host-upstream --output .artifacts/cstring-retry-diagnostic.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cstring-retry-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/cstring-retry-diagnostic.json
            .artifacts/cstring-retry-diagnostic.json.raw.json.gz
