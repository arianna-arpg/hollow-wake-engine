name: Verify vocation progression
on:
  push:
    paths:
      - '.github/workflows/vocations.yml'
      - 'baseline/vocation-progression/**'
      - 'baseline/source-lock.json'
      - 'baseline/source.tar.gz'
      - 'baseline/overlay/**'
      - 'reference/export-vocation-*.ts'
      - 'reference/tooling/package*.json'
      - 'scripts/*vocation*.mjs'
      - 'scripts/reference-utils.mjs'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: node scripts/test-reference-vocations.mjs
      - run: node scripts/test-vocation-source-faults.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: vocation-reference-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .artifacts/reference-vocations-*/verification.json
            .artifacts/vocation-source-faults-*/verification.json
