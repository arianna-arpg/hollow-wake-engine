name: Verify native string cleanup revision 2
on:
  push:
    paths:
      - '.github/workflows/cstring-cleanup-v2.yml'
      - '.github/actions/prepare-embedded-runtime/**'
      - 'experiments/embedded-js/patches/*v2*'
      - 'experiments/embedded-js/patches/cstring-cleanup.json'
      - 'experiments/embedded-js/patches/cstring-cleanup.mjs'
      - 'experiments/embedded-js/host-source-lock.json'
      - 'experiments/embedded-js/tracked-allocator.h'
      - 'scripts/embedded-native-tools.mjs'
      - 'scripts/native-tools.mjs'
      - 'scripts/reference-utils.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
      - uses: ./.github/actions/prepare-embedded-runtime
      - name: Compare cold behavior and initialized ownership
        run: node experiments/embedded-js/patches/test-cstring-cleanup-v2.mjs --upstream .artifacts/embedded-host-upstream --output .artifacts/cstring-cleanup-v2.json
      - name: Check observations and source bindings
        run: node experiments/embedded-js/patches/verify-cstring-v2.mjs --report .artifacts/cstring-cleanup-v2.json
      - name: Reject deliberately corrupted evidence
        run: node experiments/embedded-js/patches/test-cstring-v2-evidence.mjs --report .artifacts/cstring-cleanup-v2.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-string-cleanup-v2-${{ runner.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/cstring-cleanup-v2.json
            .artifacts/cstring-cleanup-v2.json.raw.json.gz
