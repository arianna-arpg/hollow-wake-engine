name: Verify pinned tool downloads
on:
  push:
    paths:
      - '.github/workflows/tool-downloads.yml'
      - '.github/workflows/character-rules.yml'
      - '.github/workflows/device-lifecycle.yml'
      - '.github/workflows/unlock-lifecycle.yml'
      - '.github/workflows/godot-native.yml'
      - 'scripts/tool-download.mjs'
      - 'scripts/install-reference-electron.mjs'
      - 'scripts/prepare-godot-tools.mjs'
      - 'scripts/test-tool-downloads.mjs'
      - 'scripts/reference-utils.mjs'
      - 'test/tool-download.test.mjs'
      - 'experiments/godot-native/toolchain-lock.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloads:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
      - run: node scripts/test-tool-downloads.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tool-downloads-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/tool-downloads.json
            .artifacts/tool-downloads.json.logs.json.gz
