name: Verify account character binding
on:
  push:
    paths:
      - '.github/workflows/account-character-binding.yml'
      - 'src/**'
      - 'baseline/**'
      - 'reference/export-account-character-binding.ts'
      - 'test/account-character-binding.test.mjs'
      - 'test/account-relic-items-fixture.mjs'
      - 'test/shared-account/**'
      - 'scripts/*account-character-binding*.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run build
      - run: npm run test:account-character-binding-package
      - run: npm run reference:account-character-binding
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: account-character-binding-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/account-character-binding-package.json
            .artifacts/account-character-binding-package.logs.json.gz
            .artifacts/account-character-binding-reference.json
            .artifacts/account-character-binding-reference.logs.json.gz
