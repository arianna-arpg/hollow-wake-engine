name: Verify guard disciplines
on:
  push:
    paths:
      - '.github/workflows/guard-arts.yml'
      - 'src/guard-arts.ts'
      - 'adapters/hollow-wake/guardArts*.ts'
      - 'adapters/hollow-wake/integrate-guard-arts.mjs'
      - 'adapters/hollow-wake/install-character-sources.mjs'
      - 'baseline/guard-build/**'
      - 'baseline/bond-build/**'
      - 'baseline/companion-world-build/**'
      - 'baseline/guard-mechanics/**'
      - 'reference/export-guard-build.ts'
      - 'reference/export-bond-build.ts'
      - 'reference/export-companion-world-build.ts'
      - 'test/guard-arts*'
      - 'scripts/test-guard-arts-package.mjs'
      - 'scripts/test-game-guard-arts.mjs'
      - 'scripts/reference-build-lifecycles.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run build
      - run: npm run test:guard-arts-package
      - run: npm run reference:build-lifecycles
      - run: npm run adapter:guard-arts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: guard-disciplines-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/guard-arts-package.json
            .artifacts/guard-arts-package.logs.json.gz
            .artifacts/build-lifecycles-reference.json
            .artifacts/build-lifecycles-reference.logs.json.gz
            .artifacts/guard-arts-game.json
            .artifacts/guard-arts-game.logs.json.gz
