name: Diagnose restoration timing
on:
  push:
    branches: [codex/resource-restoration]
    paths:
      - .github/workflows/restoration-diagnosis.yml
      - scripts/run-restoration-diagnosis-ci.mjs
      - baseline/milestone-forty-three/linux-diagnosis-plan.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run reference:prepare
      - run: npm run reference:install
      - name: Prepare independent installations and collect the frozen protocol
        timeout-minutes: 50
        run: npm run diagnose:restoration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: restoration-linux-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/restoration-diagnosis-ci.json
            .artifacts/restoration-diagnosis-ci-*/*.json
            .artifacts/restoration-diagnosis-ci-*/*.txt
            .artifacts/restoration-timing-diagnosis-location.json
            .artifacts/restoration-timing-diagnosis-*/*.json
            .artifacts/restoration-timing-diagnosis-*/*.ts
            .artifacts/restoration-timing-diagnosis-*/*.txt
