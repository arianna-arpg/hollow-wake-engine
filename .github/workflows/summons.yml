name: Verify summon birth and offspring
on:
  push:
    paths:
      - '.github/workflows/summons.yml'
      - 'src/summon-*.ts'
      - 'src/aura-*.ts'
      - 'src/companion-*.ts'
      - 'src/body-levels.ts'
      - 'src/minion-inheritance.ts'
      - 'src/attribute-bequests.ts'
      - 'adapters/hollow-wake/**'
      - 'baseline/summon-*/**'
      - 'baseline/aura-*/**'
      - 'baseline/body-levels/**'
      - 'baseline/companion-continuation/**'
      - 'baseline/companion-recovery/**'
      - 'baseline/retirement-contact/**'
      - 'reference/export-summon-*.ts'
      - 'reference/export-aura-*.ts'
      - 'reference/export-body-levels.ts'
      - 'reference/export-companion-*.ts'
      - 'reference/export-retirement-contact.ts'
      - 'test/summon-*'
      - 'test/companion-continuation-game.ts'
      - 'scripts/test-*summon*.mjs'
      - 'scripts/reference-summons.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/npm-cli.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summons:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run build
      - run: npm run test:summons-package
      - run: npm run reference:summons
      - run: npm run adapter:summons
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: summons-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/summons-package.json
            .artifacts/summons-package.logs.json.gz
            .artifacts/summons-reference.json
            .artifacts/summons-reference.logs.json.gz
            .artifacts/summons-game.json
            .artifacts/summons-game.logs.json.gz
