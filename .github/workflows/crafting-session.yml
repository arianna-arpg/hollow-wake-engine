name: Verify owned crafting sessions
on:
  push:
    paths:
      - '.github/workflows/crafting-session.yml'
      - 'src/**'
      - 'baseline/**'
      - 'scripts/*crafting-session*.mjs'
      - 'scripts/*content-table*.mjs'
      - 'scripts/compile-*.mjs'
      - 'scripts/catalogue-tools.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/npm-cli.mjs'
      - 'test/crafting-session.test.mjs'
      - 'test/content-table.test.mjs'
      - 'package*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:crafting-session-package
      - run: npm run test:crafting-session-faults
      - run: npm run test:content-table-package
      - run: npm run test:content-table-faults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: crafting-session-${{ matrix.os }}
          path: |
            .artifacts/crafting-session-package-latest.json
            .artifacts/crafting-session-package-latest.logs.json.gz
            .artifacts/crafting-session-faults-latest.json
            .artifacts/crafting-session-faults-latest.logs.json.gz
            .artifacts/content-table-package-*/verification.json
            .artifacts/content-table-package-*/*.txt
            .artifacts/content-table-faults-latest.json
            .artifacts/content-table-faults-latest.logs.json.gz
          include-hidden-files: true
          if-no-files-found: error
