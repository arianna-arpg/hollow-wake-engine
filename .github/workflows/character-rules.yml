name: Verify character rules
on:
  push:
    paths:
      - '.github/workflows/character-rules.yml'
      - 'baseline/character-rules/**'
      - 'package*.json'
      - 'src/character-identity.ts'
      - 'src/class-*.ts'
      - 'test/character-rules.test.mjs'
      - 'adapters/hollow-wake/*character*.mjs'
      - 'scripts/test-character-rules*.mjs'
      - 'scripts/test-installed-character*.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'baseline/renderer-shell.json*'
      - 'adapters/hollow-wake/character-rules-ui.cjs'
      - 'scripts/test-renderer-course.mjs'
      - 'scripts/test-reference-character-screen.mjs'
      - 'scripts/build-game-item-ui.mjs'
      - 'baseline/source-lock.json'
      - 'baseline/source.tar.gz'
      - 'baseline/overlay/**'
      - 'reference/export-character-*.ts'
      - 'reference/tooling/package*.json'
      - 'scripts/test-reference-character-rules.mjs'
      - 'scripts/test-character-rule-source-faults.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/vocation-reference.mjs'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: node scripts/test-reference-character-rules.mjs
      - run: node scripts/test-character-rule-source-faults.mjs
      - run: npm run build
      - run: node scripts/test-character-rules-package.mjs
      - run: node scripts/test-character-rules-overlay.mjs
      - run: npm run adapter:prepare
      - name: Replay installed character rules and altered installed behavior
        run: node scripts/test-installed-character-rules.mjs --location .artifacts/adapter-location.json
      - name: Install pinned desktop runtime
        if: runner.os == 'Windows'
        run: node .reference/node_modules/electron/install.js
      - name: Rebuild original and replay character selection, Vault and Continue
        if: runner.os == 'Windows'
        run: node scripts/test-reference-character-screen.mjs
      - name: Rebuild the installed game and replay its character screen
        if: runner.os == 'Windows'
        run: node scripts/test-installed-character-screen.mjs --location .artifacts/adapter-location.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: character-reference-${{ matrix.os }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .artifacts/reference-character-rules-*/verification.json
            .artifacts/character-rule-source-faults-*/verification.json
            .artifacts/character-rules-ui-*/verification.json
            .artifacts/character-rules-ui-*/observations.json
            .artifacts/character-rules-package-*/verification.json
            .artifacts/character-rules-overlay-*/verification.json
            .artifacts/installed-character-rules-*/verification.json
