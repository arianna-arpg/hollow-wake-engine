name: Verify embedded host experiment
on:
  push:
    paths:
      - '.github/workflows/embedded-host.yml'
      - 'experiments/embedded-js/**'
      - 'scripts/test-embedded-host.mjs'
      - 'scripts/test-embedded-session.mjs'
      - 'scripts/test-embedded-library.mjs'
      - 'scripts/test-native-attack-course.mjs'
      - 'adapters/hollow-wake/**'
      - 'scripts/benchmark-embedded-library.mjs'
      - 'experiments/item-index/**'
      - 'scripts/test-content-index.mjs'
      - 'scripts/benchmark-content-index.mjs'
      - 'scripts/profile-content-index.mjs'
      - 'scripts/native-tools.mjs'
      - 'scripts/embedded-native-tools.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/compile-item-content.mjs'
      - 'scripts/compile-passive-content.mjs'
      - 'src/**'
      - 'content/**'
      - 'baseline/**'
      - 'package*.json'
      - 'tsconfig*.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run build
      - run: npm run reference:prepare
      - run: npm run reference:install
      - name: Fetch pinned development runtime source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content experiments/embedded-js/host-source-lock.json -Raw | ConvertFrom-Json
          $sourceDirectory = Join-Path $PWD '.artifacts/embedded-host-upstream'
          New-Item -ItemType Directory -Path $sourceDirectory | Out-Null
          $archivePath = Join-Path $sourceDirectory $lock.archive.name
          $download = 'https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/' + $lock.archive.name
          Invoke-WebRequest -Uri $download -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.archive.sha256) {
            throw 'Runtime archive hash differs from the pinned release'
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            foreach ($file in $lock.files.PSObject.Properties) {
              $entry = $archive.GetEntry($file.Name)
              if ($null -eq $entry -or $entry.FullName -notin @('quickjs-amalgam.c', 'quickjs.h')) {
                throw 'Unexpected runtime source archive layout'
              }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $sourceDirectory $file.Name), $false)
            }
          } finally { $archive.Dispose() }
      - name: Verify compatibility, limits and disposal
        run: node scripts/test-embedded-host.mjs --amalgam-dir .artifacts/embedded-host-upstream
      - name: Verify persistent sessions and batched calls
        run: node scripts/test-embedded-session.mjs --amalgam-dir .artifacts/embedded-host-upstream
      - name: Verify library ownership and independent consumers
        run: node scripts/test-embedded-library.mjs --amalgam-dir .artifacts/embedded-host-upstream --session-fixture .artifacts/embedded-session-latest.json
      - name: Verify equivalent cost workloads without recording timings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libraryProof = (Get-Content .artifacts/embedded-library-latest.json -Raw | ConvertFrom-Json).directory
          $sessionProof = (Get-Content .artifacts/embedded-session-latest.json -Raw | ConvertFrom-Json).directory
          node scripts/benchmark-embedded-library.mjs --verify --library-proof $libraryProof --session-proof $sessionProof
      - name: Verify isolated item-index candidate and cost controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $libraryProof = (Get-Content .artifacts/embedded-library-latest.json -Raw | ConvertFrom-Json).directory
          $sessionProof = (Get-Content .artifacts/embedded-session-latest.json -Raw | ConvertFrom-Json).directory
          $costProof = (Get-Content .artifacts/embedded-cost-verification-latest.json -Raw | ConvertFrom-Json).directory
          node scripts/test-content-index.mjs --library-proof $libraryProof --session-proof $sessionProof
          if ($LASTEXITCODE -ne 0) { throw 'Candidate verification failed' }
          $candidateProof = (Get-Content .artifacts/content-index-candidate-latest.json -Raw | ConvertFrom-Json).directory
          node scripts/benchmark-content-index.mjs --verify --candidate-proof $candidateProof --cost-proof $costProof
          if ($LASTEXITCODE -ne 0) { throw 'Cost-control verification failed' }
      - name: Verify isolated bitmap candidate and cost controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $libraryProof = (Get-Content .artifacts/embedded-library-latest.json -Raw | ConvertFrom-Json).directory
          $sessionProof = (Get-Content .artifacts/embedded-session-latest.json -Raw | ConvertFrom-Json).directory
          $costProof = (Get-Content .artifacts/embedded-cost-verification-latest.json -Raw | ConvertFrom-Json).directory
          node scripts/test-content-index.mjs --library-proof $libraryProof --session-proof $sessionProof --index bitmap
          if ($LASTEXITCODE -ne 0) { throw 'Bitmap candidate verification failed' }
          $candidateProof = (Get-Content .artifacts/content-index-candidate-latest.json -Raw | ConvertFrom-Json).directory
          node scripts/benchmark-content-index.mjs --verify --candidate-proof $candidateProof --cost-proof $costProof --index bitmap
          if ($LASTEXITCODE -ne 0) { throw 'Bitmap cost-control verification failed' }
      - name: Prepare the complete installed game adapter
        run: npm run adapter:prepare
      - name: Compare original and installed full attack course in the native runtime
        run: node scripts/test-native-attack-course.mjs --location .artifacts/adapter-location.json --amalgam-dir .artifacts/embedded-host-upstream
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: embedded-host-${{ runner.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/native-attack-course-latest.json
            .artifacts/native-attack-course-*/verification.json
            .artifacts/native-attack-course-*/requests.jsonl
            .artifacts/native-attack-course-*/input.json
            .artifacts/native-attack-course-*/native/build-commands.json
            .artifacts/native-attack-course-*/native/build.txt
            .artifacts/native-attack-course-*/library/build-commands.json
            .artifacts/native-attack-course-*/library/build.txt
            .artifacts/native-attack-course-*/library/exports.txt
            .artifacts/native-attack-course-*/*/verification.json
            .artifacts/native-attack-course-*/*/metafile.json
            .artifacts/native-attack-course-*/*/entry.ts
            .artifacts/native-attack-course-*/*/*.jsonl
            .artifacts/native-attack-course-*/*/node-services.json
            .artifacts/native-attack-course-*/*/native.txt
            .artifacts/native-attack-course-*/*/library.txt
            .artifacts/embedded-host-latest.json
            .artifacts/embedded-host-*/verification.json
            .artifacts/embedded-host-*/input.json
            .artifacts/embedded-host-*/build-commands.json
            .artifacts/embedded-host-*/*.jsonl
            .artifacts/embedded-host-*/*.txt
            .artifacts/embedded-session-latest.json
            .artifacts/embedded-session-*/verification.json
            .artifacts/embedded-session-*/input.json
            .artifacts/embedded-session-*/build-commands.json
            .artifacts/embedded-session-*/*.jsonl
            .artifacts/embedded-session-*/*.txt
            .artifacts/embedded-library-latest.json
            .artifacts/embedded-library-*/verification.json
            .artifacts/embedded-library-*/build-commands.json
            .artifacts/embedded-library-*/sanitized/build-commands.json
            .artifacts/embedded-library-*/sanitized/*.txt
            .artifacts/embedded-library-*/*.jsonl
            .artifacts/embedded-library-*/*.txt
            .artifacts/embedded-cost-verification-latest.json
            .artifacts/embedded-cost-verification-*/verification.json
            .artifacts/embedded-cost-verification-*/workload.json
            .artifacts/embedded-cost-verification-*/*.txt
            .artifacts/embedded-cost-verification-*/**/events.jsonl
            .artifacts/embedded-cost-verification-*/**/memory.json
            .artifacts/embedded-cost-verification-*/**/stderr.txt
            .artifacts/content-index-candidate-latest.json
            .artifacts/content-index-candidate-*/*.json
            .artifacts/content-index-candidate-*/*.jsonl
            .artifacts/content-index-candidate-*/*.txt
            .artifacts/content-index-candidate-*/native/*.json
            .artifacts/content-index-candidate-*/native/*.jsonl
            .artifacts/content-index-candidate-*/native/*.txt
            .artifacts/content-index-candidate-*/pool-probes/verification.json
            .artifacts/content-index-verification-latest.json
            .artifacts/content-index-verification-*/*.json
            .artifacts/content-index-verification-*/*.txt
            .artifacts/content-index-verification-*/**/job.json
            .artifacts/content-index-verification-*/**/events.jsonl
            .artifacts/content-index-verification-*/**/stderr.txt
