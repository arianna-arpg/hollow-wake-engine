name: Verify equipment skill lifecycle
on:
  push:
    paths:
      - '.github/workflows/equipment-skills.yml'
      - 'src/equipment-skills.ts'
      - 'test/equipment-skills.test.mjs'
      - 'adapters/hollow-wake/integrate-equipment-skills.mjs'
      - 'reference/equipment-skill-observer.ts'
      - 'reference/export-equipment-catalogue.ts'
      - 'scripts/equipment-skill-reference.mjs'
      - 'scripts/reference-equipment-skills.mjs'
      - 'scripts/test-equipment-skills-original.mjs'
      - 'baseline/equipment-skills/**'
      - 'baseline/equipment-catalogue/**'
      - 'baseline/source-lock.json'
      - 'package.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/equipment-skills.test.mjs
      - run: npm run reference:prepare
      - run: npm run reference:install
      - name: Replay original lifecycle in two fresh processes
        run: npm run reference:equipment-skills
      - name: Verify installed game, catalogue and deliberate faults
        run: npm run test:equipment-skills-original
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: equipment-skills-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/equipment-skills-reference-*.json
            .artifacts/equipment-skills-installed.json
            .artifacts/equipment-skills-installed.logs.json.gz
