name: Verify character continuity
on:
  push:
    paths:
      - '.github/workflows/character-continuity.yml'
      - 'baseline/character-continuity/**'
      - 'package*.json'
      - 'src/class-*.ts'
      - 'src/mercenary-identity.ts'
      - 'src/character-continuity-content.ts'
      - 'test/character-continuity.test.mjs'
      - 'adapters/hollow-wake/*character*.mjs'
      - 'scripts/*character-continuity*.mjs'
      - 'scripts/prepare-game-adapter.mjs'
      - 'scripts/stop-benchmark-worker.mjs'
      - 'scripts/test-benchmark-worker-shutdown.mjs'
      - 'scripts/*hit-sustain*benchmark*.mjs'
      - 'scripts/benchmark-hit-sustain.mjs'
      - 'baseline/source-lock.json'
      - 'baseline/source.tar.gz'
      - 'baseline/overlay/**'
      - 'reference/export-continuity-*.ts'
      - 'reference/tooling/package*.json'
      - 'scripts/character-reference.mjs'
      - 'scripts/reference-utils.mjs'
      - 'scripts/vocation-reference.mjs'
      - 'scripts/test-reference-character-continuity.mjs'
      - 'scripts/test-character-continuity-source-faults.mjs'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: node scripts/test-reference-character-rules.mjs
      - run: node scripts/test-reference-character-continuity.mjs
      - run: node scripts/test-character-continuity-source-faults.mjs
      - run: node scripts/test-benchmark-worker-shutdown.mjs
      - run: npm run build
      - run: node scripts/test-character-continuity-package.mjs
      - run: node scripts/test-character-continuity-overlay.mjs
      - run: npm run adapter:prepare
      - run: node scripts/test-installed-character-continuity.mjs --location .artifacts/adapter-location.json
      - run: node scripts/test-hit-sustain-benchmark-observer.mjs --location .artifacts/adapter-location.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: character-continuity-${{ matrix.os }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .artifacts/reference-character-rules-*/verification.json
            .artifacts/reference-character-continuity-*/verification.json
            .artifacts/character-continuity-source-faults-*/verification.json
            .artifacts/character-continuity-package-*/verification.json
            .artifacts/character-continuity-package-*/*.tgz
            .artifacts/character-continuity-overlay-*/verification.json
            .artifacts/installed-character-continuity-*/verification.json
            .artifacts/benchmark-worker-shutdown-*/verification.json
            .artifacts/hit-sustain-benchmark-observer-*/*.json
            .artifacts/hit-sustain-benchmark-observer-*/*.txt
            .artifacts/hit-sustain-benchmark-*/verification.json
            .artifacts/hit-sustain-benchmark-*/*.txt
