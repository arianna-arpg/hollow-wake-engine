name: Verify engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run native:verify
      - run: npm run native:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-lifecycle-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/native-latest.json
            .artifacts/native-lifecycle-*/verification.json
            .artifacts/native-lifecycle-*/verification.txt
            .artifacts/native-package-*/package-verification.json
            .artifacts/native-package-*/package-verification.txt
            .artifacts/native-package-*/*.tar.gz
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run reference:install
      - run: npm run reference:verify
      - run: npm run reference:lifecycle
      - run: npm run reference:inventory
      - run: npm run reference:items
      - run: npm run reference:item-bridge
      - run: npm run check
        working-directory: .reference
      - run: npm run sim -- run --suite smoke
        working-directory: .reference
      - run: npm run adapter:prepare
      - run: npm run adapter:verify
      - run: npm run adapter:items
      - run: npm run check
        working-directory: .artifacts/game-adapter
      - run: npm run sim -- run --suite smoke
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_castingcues.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_costlevers.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_overdrive.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_defenses.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_statusvoice.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_itemreadability.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_relicuniques.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_relicflow.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_relicdeath.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_emergentuniques.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_skillitems.ts
        working-directory: .artifacts/game-adapter
