name: Verify engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run native:verify
      - run: npm run native:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-lifecycle-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/native-latest.json
            .artifacts/native-lifecycle-*/verification.json
            .artifacts/native-lifecycle-*/verification.txt
            .artifacts/native-package-*/package-verification.json
            .artifacts/native-package-*/package-verification.txt
            .artifacts/native-package-*/*.tar.gz
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run adapter:ui-source
      - run: npm run adapter:grant-source
      - run: npm run reference:install
      - run: npm run reference:verify
      - run: npm run reference:lifecycle
      - run: npm run reference:inventory
      - run: npm run reference:items
      - run: npm run reference:item-bridge
      - run: npm run reference:passives
      - run: npm run reference:passive-grants
      - run: node --import tsx balance/probe_passiverefund.ts
        working-directory: .reference
      - run: node --import tsx balance/probe_choices.ts
        working-directory: .reference
      - run: npm run check
        working-directory: .reference
      - run: npm run sim -- run --suite smoke
        working-directory: .reference
      - run: npm run adapter:prepare
      - run: npm run adapter:verify
      - run: npm run adapter:items
      - run: npm run adapter:passive-grants
      - run: npm run check
        working-directory: .artifacts/game-adapter
      - run: npm run sim -- run --suite smoke
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_castingcues.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_costlevers.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_overdrive.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_defenses.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_statusvoice.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_itemreadability.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_relicuniques.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_relicflow.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_relicdeath.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_emergentuniques.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_skillitems.ts
        working-directory: .artifacts/game-adapter
      - run: node --import tsx balance/probe_passiveattributes.ts
        working-directory: .artifacts/game-adapter
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: game-adapter-receipts
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/inventory-ui-overlay-verification.json
            .artifacts/adapter-verification.json
            .artifacts/game-item-verification.json
            .artifacts/game-passive-grant-verification.json
            .artifacts/passive-grant-overlay-verification.json
