name: Verify engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run native:verify
      - run: npm run native:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-lifecycle-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/native-latest.json
            .artifacts/native-lifecycle-*/verification.json
            .artifacts/native-lifecycle-*/verification.txt
            .artifacts/native-package-*/package-verification.json
            .artifacts/native-package-*/package-verification.txt
            .artifacts/native-package-*/*.tar.gz
  reference:
    runs-on: ubuntu-24.04
    steps:
