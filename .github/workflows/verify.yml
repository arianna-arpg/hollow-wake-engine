name: Verify engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run native:verify
      - run: npm run native:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-lifecycle-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/native-latest.json
            .artifacts/native-lifecycle-*/verification.json
            .artifacts/native-lifecycle-*/verification.txt
            .artifacts/native-package-*/package-verification.json
            .artifacts/native-package-*/package-verification.txt
            .artifacts/native-package-*/*.tar.gz
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reference:prepare
      - run: npm run adapter:ui-source
      - run: npm run adapter:grant-source
      - run: npm run adapter:policy-source
      - run: npm run adapter:inventory-source
      - run: npm run adapter:stash-source
      - run: npm run adapter:container-source
      - run: npm run adapter:relic-source
      - run: npm run adapter:relic-actions-source
      - run: npm run adapter:equipment-source
      - run: npm run adapter:progression-source
      - run: npm run adapter:skills-source
      - run: npm run adapter:support-source
      - run: npm run adapter:resource-source
      - run: npm run adapter:resource-events-source
      - run: npm run adapter:charged-source
      - run: npm run adapter:interactive-source
      - run: npm run adapter:channel-source
      - run: npm run adapter:guard-source
      - run: npm run adapter:payment-source
      - run: npm run adapter:ammunition-source
      - run: npm run reference:install
      - run: npm run reference:verify
      - run: npm run reference:lifecycle
      - run: npm run reference:inventory
      - run: npm run reference:items
      - run: npm run reference:item-bridge
      - run: npm run reference:passives
      - run: npm run reference:passive-grants
      - run: npm run reference:policy-host
      - run: npm run reference:inventory-host
      - run: npm run reference:stash
      - run: npm run reference:containers
      - run: npm run reference:relics
      - run: npm run reference:relic-actions
      - run: npm run reference:equipment-actions
      - run: npm run reference:progression
      - run: npm run reference:skills
      - run: npm run reference:supports
      - run: npm run reference:resources
      - run: npm run reference:resource-events
      - run: npm run reference:charged-casting
      - run: npm run reference:interactive-casting
      - run: npm run reference:channel-casting
      - run: npm run reference:guard-casting
      - run: npm run reference:resource-payment
      - run: npm run reference:admission
      - run: npm run reference:ammunition
      - run: node --import tsx balance/probe_passiverefund.ts
        working-directory: .reference
      - run: node --import tsx balance/probe_choices.ts
        working-directory: .reference
      - run: npm run check
        working-directory: .reference
      - run: npm run sim -- run --suite smoke
        working-directory: .reference
      - run: npm run adapter:prepare
      - run: npm run adapter:verify
      - run: npm run adapter:items
      - run: npm run adapter:passive-grants
      - run: npm run adapter:policy
      - run: npm run adapter:inventory-host
      - run: npm run adapter:stash
      - run: npm run adapter:containers
      - run: npm run adapter:relics
      - run: npm run adapter:relic-actions
      - run: npm run adapter:equipment-actions
      - run: npm run adapter:progression
      - run: npm run adapter:skills
      - run: npm run adapter:supports
      - run: npm run adapter:resources
      - run: npm run adapter:resource-events
      - run: npm run adapter:charged-casting
      - run: npm run adapter:interactive-casting
      - run: npm run adapter:channel-casting
      - run: npm run adapter:guard-casting
      - run: npm run adapter:resource-payment
      - run: npm run adapter:ammunition
