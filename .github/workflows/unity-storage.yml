name: Verify Unity package archive
on:
  push:
    paths:
      - '.github/workflows/unity-storage.yml'
      - 'scripts/unity-package-archive.py'
      - 'scripts/unity-gameplay-archive.py'
      - 'scripts/package-unity-gameplay.mjs'
      - 'scripts/package-unity-storage.mjs'
      - 'scripts/verify-unity-storage.py'
      - 'scripts/check-unity-storage-evidence.mjs'
      - 'scripts/check-live-equipment-evidence.mjs'
      - 'scripts/check-unity-progression-evidence.mjs'
      - 'scripts/verify-unity-progression.py'
      - 'scripts/verify-unity-account-storage.py'
      - 'scripts/check-unity-account-storage-evidence.mjs'
      - 'scripts/check-prepared-account-evidence.mjs'
      - 'scripts/check-unity-shared-account-evidence.mjs'
      - 'scripts/evidence-source.mjs'
      - 'scripts/test-unity-progression-faults.py'
      - 'scripts/verify-live-equipment-unity.py'
      - 'scripts/test-live-equipment-unity-faults.py'
      - 'adapters/unity/**'
      - 'adapters/unity-shared-account/**'
      - 'evidence/prepared-account/**'
      - 'evidence/unity-shared-account/**'
      - 'evidence/shared-account-equipment/**'
      - 'adapters/embedded/equipment-session.mjs'
      - 'src/crafting-session.ts'
      - 'test/unity-live-equipment/**'
      - 'test/unity-progression/**'
      - 'test/unity-account-storage/**'
      - 'evidence/unity-account-storage/**'
      - 'test/unity-progression-entry.test.mjs'
      - 'evidence/unity-progression/**'
      - 'evidence/live-equipment-adapter/**'
      - 'adapters/unity-storage/**'
      - 'test/unity-storage/**'
      - 'test/unity-workshop-storage/**'
      - 'evidence/unity-storage/**'
      - 'test/unity-storage/archive-controls.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
      - run: npm ci
      - run: npm run build
      - name: Fetch the immutable live-equipment release source
        run: git fetch --no-tags --depth=1 origin 03eb2d504a9fe410b97d3959a76d4a494c5d3541
      - name: Check the published live-equipment checkpoint at its release source
        run: node scripts/check-live-equipment-evidence.mjs --source-ref 03eb2d504a9fe410b97d3959a76d4a494c5d3541
      - name: Fetch the immutable progression release source
        run: git fetch --no-tags --depth=1 origin 67fa07a50a58380af22fc52e354f0091a9009b55
      - name: Check progression evidence at its release source
        run: node scripts/check-unity-progression-evidence.mjs --source-ref 67fa07a50a58380af22fc52e354f0091a9009b55
      - name: Fetch the immutable account/storage release source
        run: git fetch --no-tags --depth=1 origin 86b75485c3497f2f0b854c8cdfeed07c8802806f
      - name: Check account/storage evidence at its release source
        run: node scripts/check-unity-account-storage-evidence.mjs --source-ref 86b75485c3497f2f0b854c8cdfeed07c8802806f
      - name: Fetch the prepared-account SDK verification source
        run: git fetch --no-tags --depth=1 origin ee663a3449fbaa29e67ba65b5293f300a97ff837
      - name: Check recorded shared-account candidate observations
        run: node scripts/check-prepared-account-evidence.mjs --source-ref ee663a3449fbaa29e67ba65b5293f300a97ff837
      - name: Fetch the immutable Unity shared-account package source
        run: git fetch --no-tags --depth=1 origin 98edfa74a4b9caecf6e0e6ef3ce49cb4365966f8
      - name: Check shared-account package observations and retained behavior
        run: node scripts/check-unity-shared-account-evidence.mjs --source-ref 98edfa74a4b9caecf6e0e6ef3ce49cb4365966f8
      - name: Fetch the shared equipment development checkpoint source
        run: git fetch --no-tags --depth=1 origin 5d138fb0b0f8f3271172f002a6e317abb8df9cf9
      - name: Check shared equipment observations and failure controls
        run: node adapters/unity-shared-account/qualification/check-equipment-evidence.mjs --source-ref 5d138fb0b0f8f3271172f002a6e317abb8df9cf9
      - name: Exercise the current progression adapter
        run: node --test test/unity-progression-entry.test.mjs
      - name: Verify owned Unity fixture cleanup
        run: python -I -B test/unity-progression/cleanup.py
      - name: Check the shared packer against the frozen published archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .artifacts -Force | Out-Null
          $archive = Join-Path (Get-Location) '.artifacts/unity-published.tgz'
          try {
            Invoke-WebRequest -Uri 'https://github.com/arianna-arpg/hollow-wake-engine/releases/download/unity-workshop-v0.2.0-preview.1/com.hollowwake.gameplay-0.2.0-preview.1.tgz' -OutFile $archive
            python -I -B test/unity-storage/archive-controls.py $archive .artifacts/unity-archive-controls.json
            if ($LASTEXITCODE -ne 0) { throw 'Frozen Unity archive comparison failed' }
          } finally {
            if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive }
          }
      - name: Retain archive verification only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-archive-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: .artifacts/unity-archive-controls.json
