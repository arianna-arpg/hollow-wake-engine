name: Verify Unity package archive
on:
  push:
    paths:
      - '.github/workflows/unity-storage.yml'
      - 'scripts/unity-package-archive.py'
      - 'scripts/unity-gameplay-archive.py'
      - 'scripts/package-unity-gameplay.mjs'
      - 'scripts/package-unity-storage.mjs'
      - 'scripts/verify-unity-storage.py'
      - 'scripts/check-unity-storage-evidence.mjs'
      - 'scripts/check-live-equipment-evidence.mjs'
      - 'scripts/check-unity-progression-evidence.mjs'
      - 'scripts/verify-unity-progression.py'
      - 'scripts/verify-unity-account-storage.py'
      - 'scripts/check-unity-account-storage-evidence.mjs'
      - 'scripts/check-prepared-account-evidence.mjs'
      - 'scripts/check-unity-shared-account-evidence.mjs'
      - 'scripts/evidence-source.mjs'
      - 'scripts/historical-typescript.mjs'
      - 'scripts/test-historical-typescript.mjs'
      - 'scripts/test-unity-progression-faults.py'
      - 'scripts/verify-live-equipment-unity.py'
      - 'scripts/test-live-equipment-unity-faults.py'
      - 'adapters/unity/**'
      - 'adapters/unity-shared-account/**'
      - 'evidence/prepared-account/**'
      - 'evidence/unity-shared-account/**'
      - 'evidence/shared-account-equipment/**'
      - 'evidence/unity-shared-equipment/**'
      - 'adapters/embedded/equipment-session.mjs'
      - 'src/crafting-session.ts'
      - 'test/unity-live-equipment/**'
      - 'test/unity-progression/**'
      - 'test/unity-account-storage/**'
      - 'evidence/unity-account-storage/**'
      - 'test/unity-progression-entry.test.mjs'
      - 'evidence/unity-progression/**'
      - 'evidence/live-equipment-adapter/**'
      - 'adapters/unity-storage/**'
      - 'test/unity-storage/**'
      - 'test/unity-workshop-storage/**'
      - 'evidence/unity-storage/**'
      - 'test/unity-storage/archive-controls.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.9.0
      - run: npm ci
      - run: npm run build
      - name: Fetch the immutable live-equipment release source
        run: git fetch --no-tags --depth=1 origin 03eb2d504a9fe410b97d3959a76d4a494c5d3541
      - name: Verify historical source compilation and isolation
        run: node --test scripts/test-historical-typescript.mjs
      - name: Check the published live-equipment checkpoint at its release source
        run: node scripts/check-live-equipment-evidence.mjs --source-ref 03eb2d504a9fe410b97d3959a76d4a494c5d3541
      - name: Fetch the immutable progression release source
        run: git fetch --no-tags --depth=1 origin 67fa07a50a58380af22fc52e354f0091a9009b55
      - name: Check progression evidence at its release source
        run: node scripts/check-unity-progression-evidence.mjs --source-ref 67fa07a50a58380af22fc52e354f0091a9009b55
      - name: Fetch the immutable account/storage release source
        run: git fetch --no-tags --depth=1 origin 86b75485c3497f2f0b854c8cdfeed07c8802806f
      - name: Check account/storage evidence at its release source
        run: node scripts/check-unity-account-storage-evidence.mjs --source-ref 86b75485c3497f2f0b854c8cdfeed07c8802806f
      - name: Fetch the prepared-account SDK verification source
        run: git fetch --no-tags --depth=1 origin ee663a3449fbaa29e67ba65b5293f300a97ff837
      - name: Check recorded shared-account candidate observations
        run: node scripts/check-prepared-account-evidence.mjs --source-ref ee663a3449fbaa29e67ba65b5293f300a97ff837
      - name: Fetch the immutable Unity shared-account package source
        run: git fetch --no-tags --depth=1 origin 98edfa74a4b9caecf6e0e6ef3ce49cb4365966f8
      - name: Check shared-account package observations and retained behavior
        run: node scripts/check-unity-shared-account-evidence.mjs --source-ref 98edfa74a4b9caecf6e0e6ef3ce49cb4365966f8
      - name: Fetch the shared equipment development checkpoint source
        run: git fetch --no-tags --depth=1 origin 5d138fb0b0f8f3271172f002a6e317abb8df9cf9
      - name: Check shared equipment observations and failure controls
        run: node adapters/unity-shared-account/qualification/check-equipment-evidence.mjs --source-ref 5d138fb0b0f8f3271172f002a6e317abb8df9cf9
      - name: Fetch the retained equipment qualification source
        run: git fetch --no-tags --depth=1 origin 4fb5c72b3bbccff87d748a6624e4594658c30975
      - name: Check retained features in the equipment candidates
        run: node adapters/unity-shared-account/qualification/check-equipment-retained.mjs --source-ref 4fb5c72b3bbccff87d748a6624e4594658c30975
      - name: Fetch the versioned equipment preview source
        run: git fetch --no-tags --depth=1 origin bb50099f8d516f4d1faf938283f37c09a10c1933
      - name: Check installed equipment preview observations and source lineage
        run: node adapters/unity-shared-account/qualification/check-equipment-preview.mjs --source-ref bb50099f8d516f4d1faf938283f37c09a10c1933
      - name: Exercise the current progression adapter
        run: node --test test/unity-progression-entry.test.mjs
      - name: Verify owned Unity fixture cleanup
        run: python -I -B test/unity-progression/cleanup.py
      - name: Check the shared packer against the frozen published archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .artifacts -Force | Out-Null
          $archive = Join-Path (Get-Location) '.artifacts/unity-published.tgz'
          try {
            Invoke-WebRequest -Uri 'https://github.com/arianna-arpg/hollow-wake-engine/releases/download/unity-workshop-v0.2.0-preview.1/com.hollowwake.gameplay-0.2.0-preview.1.tgz' -OutFile $archive
            python -I -B test/unity-storage/archive-controls.py $archive .artifacts/unity-archive-controls.json
            if ($LASTEXITCODE -ne 0) { throw 'Frozen Unity archive comparison failed' }
          } finally {
            if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive }
          }
      - name: Rebuild the versioned equipment previews from their immutable source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = git rev-parse HEAD
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Tracked changes before historical rebuild' }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Staged changes before historical rebuild' }
          $artifactRoot = (Resolve-Path -LiteralPath .artifacts).Path
          $work = [IO.Path]::GetFullPath((Join-Path $artifactRoot 'equipment-preview-rebuild'))
          if ([IO.Path]::GetDirectoryName($work) -ne $artifactRoot -or (Test-Path -LiteralPath $work)) { throw 'Unexpected rebuild directory' }
          New-Item -ItemType Directory -Path $work | Out-Null
          try {
            git switch --detach bb50099f8d516f4d1faf938283f37c09a10c1933
            if ($LASTEXITCODE -ne 0) { throw 'Historical source checkout failed' }
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Historical dependencies failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Historical SDK build failed' }
            $gameplayParent = Join-Path $work 'gameplay-parent.tgz'
            $storageParent = Join-Path $work 'storage-parent.tgz'
            Invoke-WebRequest 'https://github.com/arianna-arpg/hollow-wake-engine/releases/download/unity-shared-account-v0.5.0-preview.1/com.hollowwake.gameplay-0.5.0-preview.1.tgz' -OutFile $gameplayParent
            Invoke-WebRequest 'https://github.com/arianna-arpg/hollow-wake-engine/releases/download/unity-shared-account-v0.5.0-preview.1/com.hollowwake.storage-0.4.0-preview.1.tgz' -OutFile $storageParent
            $candidate = Join-Path $work 'candidate'
            $preview = Join-Path $work 'preview'
            python -I -B adapters/unity-shared-account/qualification/equipment-package.py --gameplay $gameplayParent --storage $storageParent --output $candidate
            if ($LASTEXITCODE -ne 0) { throw 'Historical equipment candidate rebuild failed' }
            python -I -B adapters/unity-shared-account/qualification/package-equipment-preview.py --candidate $candidate --output $preview
            if ($LASTEXITCODE -ne 0) { throw 'Equipment preview rebuild failed' }
            python -I -B adapters/unity-shared-account/qualification/verify-equipment-preview-archives.py --candidate $candidate --preview $preview --output .artifacts/shared-equipment-preview-archive-controls.json
            if ($LASTEXITCODE -ne 0) { throw 'Equipment preview archive controls failed' }
          } finally {
            try {
              git switch --detach $original
              if ($LASTEXITCODE -ne 0) { throw 'Could not restore checked-out source after historical rebuild' }
            } finally {
              if ((Split-Path -Parent (Resolve-Path -LiteralPath $work).Path) -ne $artifactRoot) { throw 'Unexpected rebuild cleanup path' }
              Remove-Item -LiteralPath $work -Recurse
            }
          }
          node --input-type=commonjs -e 'const fs=require("node:fs"),a=JSON.parse(fs.readFileSync("evidence/unity-shared-equipment/acceptance.json")),r=JSON.parse(fs.readFileSync(".artifacts/shared-equipment-preview-archive-controls.json"));if(!r.passed||!r.cleaned||!r.inputsUnchanged)throw Error("Archive controls failed");for(const name of ["gameplay","storage"])if(r.packages[name].sha256!==a[name+"Sha256"])throw Error("Published preview differs: "+name);'
          if ($LASTEXITCODE -ne 0) { throw 'Recorded preview identities differ' }
      - name: Retain archive verification only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-archive-${{ matrix.os }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .artifacts/unity-archive-controls.json
            .artifacts/shared-equipment-preview-archive-controls.json
